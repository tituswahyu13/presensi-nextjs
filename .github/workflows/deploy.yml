name: Auto Deploy PresPAM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy Application
        run: |
          # Load PATH standar Ubuntu
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

          # Masuk ke direktori proyek
          cd /var/www/presensi-nextjs

          # Sinkronisasi kodingan terbaru dari GitHub
          git fetch origin main
          git reset --hard origin/main

          # Install dependensi & build aplikasi
          npm install
          npx prisma generate
          npx prisma db push
          npm run build

          # Restart aplikasi di PM2
          PORT=3002 pm2 restart prespam || PORT=3002 pm2 start npm --name "prespam" -- start